<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASOTRÁNSITO AMB · Plataforma de Socios</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/mockup2.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="plataforma">

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <i class="fa-solid fa-car-side"></i>
      <h1>ASOTRÁNSITO AMB</h1>
      <p>Plataforma de Socios</p>
    </div>
    <form id="loginForm" onsubmit="return login(event)">
      <label>Usuario</label>
      <input type="text" id="usuario" placeholder="admin o socio" required autocomplete="username">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="cualquiera" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:14px;">
        <i class="fa-solid fa-right-to-bracket"></i> Ingresar
      </button>
    </form>
    <p class="login-hint">
      <i class="fa-solid fa-circle-info"></i>
      Usa <b>admin</b> o <b>socio</b> como usuario (contraseña cualquiera)
    </p>
    <a href="mockup1.html" class="login-back"><i class="fa-solid fa-arrow-left"></i> Volver al portal público</a>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="fa-solid fa-car-side"></i>
      <span>ASOTRÁNSITO</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="active" data-view="dashboard"><i class="fa-solid fa-house"></i> Panel</a>
      <a href="#" data-view="perfil"><i class="fa-solid fa-user"></i> Mi perfil</a>
      <a href="#" data-view="negocio"><i class="fa-solid fa-store"></i> Mi negocio</a>
      <a href="#" data-view="servicios"><i class="fa-solid fa-screwdriver-wrench"></i> Servicios</a>
      <a href="#" data-view="sedes"><i class="fa-solid fa-location-dot"></i> Sedes</a>
      <a href="#" data-view="blog"><i class="fa-solid fa-newspaper"></i> Blog eventos</a>
      <a href="#" data-view="usuarios" class="admin-only"><i class="fa-solid fa-users-gear"></i> Usuarios</a>
    </nav>
    <a href="mockup1.html" class="sidebar-exit"><i class="fa-solid fa-arrow-left"></i> Portal público</a>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <h1 id="viewTitle">Panel de Control</h1>
      <div class="topbar-user">
        <span class="badge badge-green" id="rolBadge">Socio</span>
        <img id="avatarTop" src="https://ui-avatars.com/api/?name=Socio&background=0a7d3e&color=fff" alt="">
        <span id="nombreTop">Socio</span>
        <button class="btn btn-outline btn-sm" onclick="logout()" aria-label="Cerrar sesión">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <div class="view-content" id="viewContent"></div>
  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="js/mockup2.js"></script>
</body>
</html>
